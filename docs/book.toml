[book]
title = "clinic-spr: learning Rust by building a clinic platform"
authors = ["Nicolas Aravena"]
language = "en"
src = "src"

[build]
build-dir = "book"
create-missing = false

[output.html]
site-url = "/clinic-spr/"
theme = "theme"
default-theme = "late"
preferred-dark-theme = "mocha"
additional-css = ["./theme/catppuccin.css"]
git-repository-url = "https://gitlab.com/nicoaravena/clinic-spr"
