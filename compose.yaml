# Postgres for local development and tests. Start it with `docker compose up -d`.
#
# The credentials are for this local container only. The port is 5433 on the host, so it doesn't
# clash with another Postgres on the default 5432.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinic
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
