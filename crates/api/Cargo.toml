[package]
name = "clinic-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
chrono-tz = "0.10"
clinic-app = { path = "../app" }
clinic-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
